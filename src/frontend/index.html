<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Elaine - Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script type="importmap">
            {
                "imports": {
                    "ftl": "https://cdn.jsdelivr.net/npm/@optionfactory/fml@8.0.0/dist/ftl.min.mjs",
                    "httpc": "https://cdn.jsdelivr.net/npm/@optionfactory/fml@8.0.0/dist/httpc.min.mjs"
                },
                "integrity": {
                    "https://cdn.jsdelivr.net/npm/@optionfactory/fml@8.0.0/dist/ftl.min.mjs": "sha384-o8jSbzfN8frPZI1vZ6AnCXymJ9qtGYaJdY8ThO2O137DNlcGX1Ug39nS6QZxsY0p",
                    "https://cdn.jsdelivr.net/npm/@optionfactory/fml@8.0.0/dist/httpc.min.mjs": "sha384-9QJP1Q+GlS7keulFI7PAA8amAXjQS6dvYexTmkbKvlJg23ISvRjVUJfDMzJ+9VEL"
                }
            }
        </script>
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@optionfactory/fml@8.0.0/dist/ftl.min.mjs">
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@optionfactory/fml@8.0.0/dist/httpc.min.mjs">
    <link rel="stylesheet" href="elaine.css">
</head>

<body>
    <header>
        <h1><svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true"><use href="favicon.svg"></use></svg>Elaine - Dashboard</h1>
        <p id="organization"></p>
        <button type="button" class="btn-roulette" data-filter="live,unaudited,roulette">
            <svg aria-hidden="true"><use href="icons.svg#icon-roulette"></use></svg>
            <span>Audit Roulette</span>
        </button>
    </header>

    <metrics-grid></metrics-grid>

    <filter-controls>
        <filter-group data-group="status">
            <label>Status:</label>
            <state-button>
                <state title="Any" active data-value="any"><svg><use href="icons.svg#icon-any"></use></svg></state>
                <state title="Live" data-value="live"><svg><use href="icons.svg#icon-live"></use></svg></state>
                <state title="Forked" data-value="forked"><svg><use href="icons.svg#icon-forked"></use></svg></state>
                <state title="Archived" data-value="archived"><svg><use href="icons.svg#icon-archived"></use></svg></state>
                <state title="Disabled" data-value="disabled"><svg><use href="icons.svg#icon-disabled"></use></svg></state>
            </state-button>
        </filter-group>

        <filter-group data-group="visibility">
            <label>Visibility:</label>
            <state-button>
                <state title="Any" active data-value="any"><svg><use href="icons.svg#icon-any"></use></svg></state>
                <state title="Public" data-value="public"><svg><use href="icons.svg#icon-public"></use></svg></state>
                <state title="Private" data-value="private"><svg><use href="icons.svg#icon-private"></use></svg></state>
            </state-button>
        </filter-group>


        <filter-group data-group="audit">
            <label>Audited:</label>
            <state-button>
                <state title="Any" active data-value="any"><svg><use href="icons.svg#icon-any"></use></svg></state>
                <state title="Audited" data-value="audited"><svg><use href="icons.svg#icon-audited"></use></svg></state>
                <state title="Not audited" data-value="unaudited"><svg><use href="icons.svg#icon-unaudited"></use></svg></state>
            </state-button>
        </filter-group>



        <filter-group data-group="vulnerability">
            <label>Vulnerabilities:</label>
            <state-button>
                <state title="Any" active data-value="any"><svg><use href="icons.svg#icon-any"></use></svg></state>
                <state title="With vulnerabilities" data-value="vulns"><svg><use href="icons.svg#icon-vulns"></use></svg></state>
                <state title="No vulnerabilities" data-value="no-vulns"><svg><use href="icons.svg#icon-no-vulns"></use></svg></state>
            </state-button>
        </filter-group>

        <filter-group data-group="outdated">
            <label>Outdated deps:</label>
            <state-button>
                <state title="Any" active data-value="any"><svg><use href="icons.svg#icon-any"></use></svg></state>
                <state title="Outdated" data-value="outdated"><svg><use href="icons.svg#icon-outdated"></use></svg></state>
                <state title="Up to date" data-value="no-outdated"><svg><use href="icons.svg#icon-no-outdated"></use></svg></state>
            </state-button>
        </filter-group>

        <filter-group data-group="tiers">
            <label>Tier:</label>
            <state-button>
                <state title="Any" active data-value="any"><svg><use href="icons.svg#icon-any"></use></svg></state>
                <state title="Tier1" data-value="tier1"><svg><use href="icons.svg#icon-tier1"></use></svg></state>
                <state title="Tier2" data-value="tier2"><svg><use href="icons.svg#icon-tier2"></use></svg></state>
                <state title="Tier3" data-value="tier3"><svg><use href="icons.svg#icon-tier3"></use></svg></state>
                <state title="Tier4" data-value="tier4"><svg><use href="icons.svg#icon-tier4"></use></svg></state>
            </state-button>
        </filter-group>

        <filter-group data-group="type">
            <label>Project type:</label>
            <state-button>
                <state title="Any" active data-value="any"><svg><use href="icons.svg#icon-any"></use></svg></state>
                <state title="Service" data-value="service"><svg><use href="icons.svg#icon-service"></use></svg></state>
                <state title="Library" data-value="library"><svg><use href="icons.svg#icon-library"></use></svg></state>
                <state title="Tool" data-value="tool"><svg><use href="icons.svg#icon-tool"></use></svg></state>
                <state title="Infrastructure" data-value="infrastructure"><svg><use href="icons.svg#icon-infrastructure"></use></svg></state>
                <state title="Documentation" data-value="documentation"><svg><use href="icons.svg#icon-documentation"></use></svg></state>
                <state title="Playground" data-value="playground"><svg><use href="icons.svg#icon-playground"></use></svg></state>
            </state-button>
        </filter-group>

        <filter-group data-group="lifecycle">
            <label>Lifecycle:</label>
            <state-button>
                <state title="Any" active data-value="any"><svg><use href="icons.svg#icon-any"></use></svg></state>
                <state title="Active" data-value="lifecycle-active"><svg><use href="icons.svg#icon-lifecycle-active"></use></svg></state>
                <state title="Deprecated" data-value="lifecycle-deprecated"><svg><use href="icons.svg#icon-lifecycle-deprecated"></use></svg></state>
                <state title="End of life" data-value="lifecycle-end-of-life"><svg><use href="icons.svg#icon-lifecycle-end-of-life"></use></svg></state>
                <state title="Maintenance" data-value="lifecycle-maintenance"><svg><use href="icons.svg#icon-lifecycle-maintenance"></use></svg></state>
                <state title="Prototype" data-value="lifecycle-prototype"><svg><use href="icons.svg#icon-lifecycle-prototype"></use></svg></state>
                <state title="Unmaintained" data-value="lifecycle-unmaintained"><svg><use href="icons.svg#icon-lifecycle-unmaintained"></use></svg></state>
            </state-button>
        </filter-group>

        <filter-group data-group="ingress">
            <label>Ingress:</label>
            <state-button>
                <state title="Any" active data-value="any"><svg><use href="icons.svg#icon-any"></use></svg></state>
                <state title="Local" data-value="ingress-local"><svg><use href="icons.svg#icon-ingress-local"></use></svg></state>
                <state title="Restricted VPN" data-value="ingress-restricted-vpn"><svg><use href="icons.svg#icon-ingress-restricted-vpn"></use></svg></state>
                <state title="Restricted IP" data-value="ingress-restricted-ip"><svg><use href="icons.svg#icon-ingress-restricted-ip"></use></svg></state>
                <state title="Restricted PAM" data-value="ingress-restricted-pam"><svg><use href="icons.svg#icon-ingress-restricted-pam"></use></svg></state>
                <state title="Internet" data-value="ingress-internet"><svg><use href="icons.svg#icon-ingress-internet"></use></svg></state>
                <state title="None" data-value="ingress-none"><svg><use href="icons.svg#icon-ingress-none"></use></svg></state>
            </state-button>
        </filter-group>

        <filter-group data-group="compliance">
            <label>Compliance:</label>
            <state-button>
                <state title="Any" active data-value="any"><svg><use href="icons.svg#icon-any"></use></svg></state>
                <state title="Compliant" data-value="compliant"><svg><use href="icons.svg#icon-compliant"></use></svg></state>
                <state title="Non-compliant" data-value="non-compliant"><svg><use href="icons.svg#icon-non-compliant"></use></svg></state>
            </state-button>
        </filter-group>

    </filter-controls>

    <search-bar>
        <form>
            <input type="text" name="search" placeholder="Search by repository, commissioner, steward, or domain..." />
        </form>
    </search-bar>

    <loading-spinner id="spinner">
        <div class="spinner"></div>
    </loading-spinner>

    <projects-grid></projects-grid>
    <scroll-sentinel></scroll-sentinel>

    <template id="metrics-template">
        <button class="metric-card all active" data-filter>
            <h2>Total Repositories</h2>
            {{ all }}
        </button>
        <button class="metric-card live" data-filter="live">
            <h2>Live Repositories</h2>
            {{ live }}
        </button>
        <button class="metric-card compliant" data-filter="live,audited">
            <h2>Audited Live Repositories</h2>
            {{ live_audited }}
        </button>
        <button class="metric-card noncompliant" data-filter="live,unaudited">
            <h2>Unaudited Live Repositories</h2>
            {{ live_unaudited }}
        </button>
    </template>

    <template id="projects-template">
        <error-box data-tpl-if="self.length == 0">No matching repositories found.</error-box>
        <project-card data-tpl-each="self">
            <project-header>
                <h2><a data-tpl-href="html_url" target="_blank" rel="noopener noreferrer">{{ name }}</a></h2>
                <p>{{ description ?? 'no descrption' }}</p>
                <badges>
                    <badge data-tpl-if="private" class="private">Private</badge>
                    <badge data-tpl-if="!private" class="public">Public</badge>
                    <badge data-tpl-if="fork" class="fork">Fork</badge>
                    <badge data-tpl-if="disabled" class="disabled">Disabled</badge>
                    <badge data-tpl-if="archived" class="archived">Archived</badge>
                    <badge data-tpl-if="!audit" class="unaudited">No Audit</badge>
                    <badge data-tpl-if="audit?.tier" class="tier">{{ audit.tier }}</badge>
                    <badge data-tpl-if="audit?.lifecycle" class="lifecycle">{{ audit.lifecycle }}</badge>
                </badges>
                <time>
                    <div>Created: {{ created_at }}</div>
                    <div>Pushed: {{ pushed_at }}</div>
                    <div>Updated: {{ updated_at }}</div>
                </time>
            </project-header>

            <info-group data-tpl-if="audit" data-tpl-with="audit">
                <info-item>
                    <span class="label">Project type</span>
                    <span class="value">{{ type}}</span>
                </info-item>
                <info-item>
                    <span class="label">Commissioner / Channel</span>
                    <span class="value">{{ commissioner ?? 'unspecified' }} / {{ channel ?? 'unspecified' }}</span>
                </info-item>
                <info-item>
                    <span class="label">Stewards</span>
                    <span class="value">{{ stewards?.join(', ') ?? 'unspecified' }}</span>
                </info-item>
                <info-item>
                    <span class="label">Authentication</span>
                    <span class="value">{{authentication?.join(', ') ?? 'unspecified' }}</span>
                </info-item>
                <info-item>
                    <span class="label">Sensitivity</span>
                    <span class="value">{{sensitivity?.join(', ') ?? 'unspecified' }}</span>
                </info-item>
            </info-group>

            <section>
                <h3>Compliance Frameworks</h3>
                <tag-list data-tpl-if="!audit?.compliance">
                    <tag>No data</tag>
                </tag-list>
                <tag-list data-tpl-if="audit?.compliance">
                    <tag>DORA: {{ audit.compliance.dora }}</tag>
                    <tag>CRA: {{audit.compliance.cra }}</tag>
                    <tag>NIS2: {{audit.compliance.nis2}}</tag>
                    <tag>AI Act: {{audit.compliance.ai_act}}</tag>
                    <tag>GDPR: {{ audit.compliance.gdpr }}</tag>
                    <tag>Data Residency: {{audit.compliance.data_residency}}</tag>
                    <tag>Ads: {{audit.compliance.ads}}</tag>
                </tag-list>
            </section>

            <section data-tpl-if="audit?.environments">
                <details>
                    <summary>
                        <h3>Environments</h3>
                        <tag-list>
                            <tag>{{ audit.environments.length }}</tag>
                        </tag-list>
                    </summary>
                    <table class="environments">
                        <thead>
                            <tr>
                                <th>Environment</th>
                                <th>Type</th>
                                <th>Platform</th>
                                <th>Ingress</th>
                                <th>Domains</th>
                                <th>Certs</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr data-tpl-each="audit.environments" data-tpl-var="env">
                                <td><strong>{{ env.name }}</strong></td>
                                <td>{{env.type}}</td>
                                <td>{{env.platform}}</td>
                                <td>{{env.ingress}}</td>
                                <td><code>{{env.domains}}</code></td>
                                <td>{{env.certificates}}</td>
                            </tr>
                        </tbody>
                    </table>
                </details>
            </section>

            <section>
                <details>
                    <summary>
                        <h3>Outdated Dependencies</h3>
                        <tag-list>
                            <tag data-tpl-if="outdated_dependencies == null">No data</tag>
                            <tag data-tpl-if="outdated_dependencies?.length == 0">No outdated dependencies found in this project</tag>
                            <tag data-tpl-if="outdated_dependencies?.length > 0">{{ outdated_dependencies.length }}</tag>
                        </tag-list>
                    </summary>
                    <table class="outdated-dependencies" data-tpl-if="outdated_dependencies?.length > 0">
                        <thead>
                            <tr>
                                <th>Project</th>
                                <th>Artifact</th>
                                <th>Current</th>
                                <th>Latest</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr data-tpl-each="outdated_dependencies" data-tpl-var="dep">
                                <td><strong>{{ dep.project }}</strong></td>
                                <td>{{dep.artifact}}</td>
                                <td>
                                    <tag class="current">{{dep.current}}</tag>
                                </td>
                                <td>
                                    <tag class="latest">{{dep.latest}}</tag>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </details>
            </section>

            <section>
                <details>
                    <summary>
                        <h3>Known vulnerabilities</h3>
                        <tag-list>
                            <tag data-tpl-if="vulnerabilities == null">No data</tag>
                            <tag data-tpl-if="vulnerabilities?.length == 0">No known vulnerabilities found in this project</tag>
                            <tag data-tpl-if="vulnerabilities?.length > 0">{{ vulnerabilities.length }}</tag>
                        </tag-list>
                    </summary>
                    <table class="vulnerabilities" data-tpl-if="vulnerabilities?.length > 0">
                        <thead>
                            <tr>
                                <th>Project</th>
                                <th>Artifact</th>
                                <th>Version</th>
                                <th>Vuln ID</th>
                                <th>Trails</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr data-tpl-each="vulnerabilities" data-tpl-var="vuln">
                                <td><strong>{{ vuln.project }}</strong></td>
                                <td>{{vuln.artifact}}</td>
                                <td>{{vuln.version}}</td>
                                <td>
                                    <a data-tpl-href="`https://github.com/advisories/{vuln.vuln_id}`" target="_blank" rel="noopener noreferrer">
                                        {{vuln.vuln_id}}
                                    </a>
                                </td>
                                <td>
                                    <tooltip-trigger>
                                        <tag class="dashed">Depth {{ vuln.trail.length }}</tag>
                                        <tooltip-content>
                                            <div data-tpl-each="vuln.trail">{{ self }}</div>
                                        </tooltip-content>
                                    </tooltip-trigger>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </details>
            </section>

            <section>
                <h3>Used containers</h3>
                <tag-list>
                    <tag data-tpl-if="!containers">
                        No data
                    </tag>
                    <tag data-tpl-if="containers?.length == 0">
                        No containers referenced in this project
                    </tag>
                    <tag data-tpl-if="containers?.length > 0" data-tpl-each="containers" class="container">
                        {{ self }}
                    </tag>
                </tag-list>
            </section>

            <section>
                <h3>Docker files</h3>
                <tag-list>
                    <tag data-tpl-if="!docker_files.length">No docker files found in this project</tag>
                    <tag data-tpl-each="docker_files" class="dockerfile">{{ self }}</tag>
                </tag-list>
            </section>

            <section>
                <h3>Ansible</h3>
                <tag-list>
                    <tag data-tpl-if="!ansible_confs.length">No ansible configurations found in this project</tag>
                    <tag data-tpl-each="ansible_confs" class="ansible">{{ self }}</tag>
                </tag-list>
            </section>

            <section>
                <h3>Legopfa</h3>
                <tag-list>
                    <tag data-tpl-if="!legopfa_confs.length">No legopfa configurations found in this project</tag>
                    <tag data-tpl-each="legopfa_confs" class="legopfa">{{ self }}</tag>
                </tag-list>
            </section>

        </project-card>
    </template>

    <script type="module">
        import { Templates } from "ftl";
        import { Spinner, InfiniteScroller, authenticate, projects } from "/elaine.js";

        const { config, http } = await authenticate();
        const spinner = new Spinner();
        const scroller = new InfiniteScroller('projects-grid', 'scroll-sentinel', '#projects-template', spinner, 5);

        document.querySelector('#organization').innerText = config.organization;
        function filtersFromControls() {
            const activeTags = [];
            document.querySelectorAll('filter-controls filter-group').forEach(group => {
                const activeBtn = group.querySelector('state[active]');
                if (activeBtn && activeBtn.dataset.value && activeBtn.dataset.value !== 'any') {
                    activeTags.push(activeBtn.dataset.value);
                }
            });
            return activeTags;
        }

        function updateFilterControls(filters) {
            document.querySelectorAll('filter-controls filter-group').forEach(group => {
                const buttons = group.querySelectorAll('state');
                let hasMatch = false;
                buttons.forEach(btn => {
                    if (filters.includes(btn.dataset.value)) {
                        btn.setAttribute('active', '');
                        hasMatch = true;
                    } else {
                        btn.removeAttribute('active');
                    }
                });
                if (!hasMatch) {
                    const defaultBtn = group.querySelector('state[data-value="any"]');
                    if (defaultBtn) defaultBtn.setAttribute('active', '');
                }
            });
        }


        function updateActiveMetricCard(filters) {
            document.querySelectorAll('.metric-card').forEach(b => {
                b.classList.remove('active');
                const cardFilter = (b.dataset.filter || '').split(',').filter(Boolean);
                if (cardFilter.length === filters.length && cardFilter.every(f => filters.includes(f))) {
                    b.classList.add('active');
                }
            });
        }

        document.querySelector('filter-controls').addEventListener('click', async e => {
            const button = e.target.closest('state');
            if (!button) return;

            const group = button.closest('filter-group');
            group.querySelectorAll('state').forEach(b => b.removeAttribute('active'));
            button.setAttribute('active', '');

            const activeFilters = filtersFromControls();
            updateActiveMetricCard(activeFilters);
            await scroller.load(projects(http, activeFilters, null));
        });

        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const search = new FormData(e.target).get('search');
            const activeFilters = filtersFromControls();
            await scroller.load(projects(http, activeFilters, search));
        });

        document.querySelector('body').addEventListener('click', async e => {
            const button = e.target.closest('[data-filter]');
            if (!button || button.closest('filter-controls')) return;

            const filters = (button.dataset.filter || '').split(',').filter(Boolean);
            if (button.classList.contains('metric-card')) {
                document.querySelectorAll('.metric-card').forEach(b => b.classList.remove('active'));
                button.classList.add('active');
            }

            updateFilterControls(filters);
            await scroller.load(projects(http, filters, null));
        });

        const stats = await http.get('/api/stats').fetchJson();
        Templates.fromSelector('#metrics-template').withOverlay(stats).renderToSelector('metrics-grid');
        await scroller.load(projects(http, [], null));
    </script>
</body>

</html>

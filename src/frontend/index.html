<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptionFactory Audit Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;500;700&amp;display=swap" rel="stylesheet">

    <script type="importmap">
            {
                "imports": {
                    "ftl": "https://cdn.jsdelivr.net/npm/@optionfactory/fml@8.0.0/dist/ftl.min.mjs"
                },
                "integrity": {
                    "https://cdn.jsdelivr.net/npm/@optionfactory/fml@8.0.0/dist/ftl.min.mjs": "sha384-o8jSbzfN8frPZI1vZ6AnCXymJ9qtGYaJdY8ThO2O137DNlcGX1Ug39nS6QZxsY0p"
                }
            }
        </script>
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@optionfactory/fml@8.0.0/dist/ftl.min.mjs">
    <link rel="stylesheet" href="repospect.css">
</head>
</head>

<body>

    <header>
        <h1>OptionFactory System Dashboard</h1>
        <p>Audit overview and projects status loaded from <code>optionfactory/latest.json</code></p>
        <button type="button" class="btn-roulette" data-filter="roulette">
            <span>Audit Roulette</span>
        </button>
    </header>

    <metrics-grid>
    </metrics-grid>

    <search-bar>
        <form>
            <input type="text" name="search" placeholder="Search by repository, commissioner, steward, or domain..." />
        </form>
    </search-bar>

    <loading-spinner id="spinner">
        <div class="spinner"></div>
    </loading-spinner>

    <projects-grid></projects-grid>
    <scroll-sentinel></scroll-sentinel>

    <template id="metrics-template">
        <button class="metric-card all" data-filter="all">
            <h2>Total Repositories</h2>
            {{ all }}
        </button>
        <button class="metric-card live" data-filter="live">
            <h2>Live Repositories</h2>
            {{ live }}
        </button>
        <button class="metric-card compliant" data-filter="live_audited">
            <h2>Audited Live Repositories</h2>
            {{ live_audited }}
        </button>
        <button class="metric-card noncompliant" data-filter="live_unaudited">
            <h2>Unaudited Live Repositories</h2>
            {{ live_unaudited }}
        </button>

        <button class="metric-card public" data-filter="public">
            <h2>Public Repositories</h2>
            {{ public }}
        </button>

        <button class="metric-card live" data-filter="live_public">
            <h2>Public Live Repositories</h2>
            {{ live_public }}
        </button>
        <button class="metric-card compliant" data-filter="live_public_audited">
            <h2>Public Audited Live Repositories</h2>
            {{ live_public_audited }}
        </button>
        <button class="metric-card noncompliant" data-filter="live_public_unaudited">
            <h2>Public Unaudited Live Repositories</h2>
            {{ live_public_unaudited }}
        </button>


        <button class="metric-card private" data-filter="private">
            <h2>Private Repositories</h2>
            {{ private }}
        </button>

        <button class="metric-card live" data-filter="live_private">
            <h2>Private Live Repositories</h2>
            {{ live_private }}
        </button>
        <button class="metric-card compliant" data-filter="live_private_audited">
            <h2>Private Audited Live Repositories</h2>
            {{ live_private_audited }}
        </button>
        <button class="metric-card noncompliant" data-filter="live_private_unaudited">
            <h2>Private Unaudited Live Repositories</h2>
            {{ live_private_unaudited }}
        </button>

        <div></div>
        <button class="metric-card" data-filter="public_vulns">
            <h2>Public Live with vulns</h2>
            {{ public_vulns }}
        </button>
        <button class="metric-card compliant" data-filter="public_audited_vulns">
            <h2>Public Audited Live with vulns</h2>
            {{ public_audited_vulns }}
        </button>
        <button class="metric-card noncompliant" data-filter="public_unaudited_vulns">
            <h2>Public Unaudited Live with vulns</h2>
            {{ public_unaudited_vulns }}
        </button>

        <div></div>
        <button class="metric-card" data-filter="private_vulns">
            <h2>Private Live with vulns</h2>
            {{ private_vulns }}
        </button>
        <button class="metric-card compliant" data-filter="private_audited_vulns">
            <h2>Private Audited Live with vulns</h2>
            {{ private_audited_vulns }}
        </button>
        <button class="metric-card noncompliant" data-filter="private_unaudited_vulns">
            <h2>Private Unaudited Live with vulns</h2>
            {{ private_unaudited_vulns }}
        </button>


    </template>

    <template id="projects-template">
        <error-box data-tpl-if="self.length == 0">No matching repositories found.</error-box>
        <project-card data-tpl-each="self">
            <project-header>
                <h2><a data-tpl-href="html_url" target="_blank" rel="noopener noreferrer">{{ name }}</a></h2>
                <p>{{ description }}</p>
                <badges>
                    <badge data-tpl-if="private" class="private">Private</badge>
                    <badge data-tpl-if="!private" class="public">Public</badge>
                    <badge data-tpl-if="fork" class="fork">Fork</badge>
                    <badge data-tpl-if="disabled" class="disabled">Disabled</badge>
                    <badge data-tpl-if="archived" class="archived">Archived</badge>
                    <badge data-tpl-if="!audit" class="unaudited">No Audit</badge>
                    <badge data-tpl-if="audit?.tier" class="tier">{{ audit.tier }}</badge>
                    <badge data-tpl-if="audit?.lifecycle" class="lifecycle">{{ audit.lifecycle }}</badge>
                </badges>
                <time>
                    <div>Created: {{ created_at }}</div>
                    <div>Updated: {{ updated_at }}</div>
                </time>
            </project-header>

            <info-group data-tpl-if="audit" data-tpl-with="audit">
                <info-item>
                    <span class="label">Project type</span>
                    <span class="value">{{ type}}</span>
                </info-item>

                <info-item>
                    <span class="label">Commissioner / Channel</span>
                    <span class="value">{{ commissioner ?? 'unspecified' }} / {{ channel ?? 'unspecified' }}</span>
                </info-item>
                <info-item>
                    <span class="label">Stewards</span>
                    <span class="value">{{ stewards?.join(', ') ?? 'unspecified' }}</span>
                </info-item>
                <info-item>
                    <span class="label">Authentication</span>
                    <span class="value">{{authentication?.join(', ') ?? 'unspecified' }}</span>
                </info-item>
                <info-item>
                    <span class="label">Sensitivity</span>
                    <span class="value">{{sensitivity?.join(', ') ?? 'unspecified' }}</span>
                </info-item>
            </info-group>

            <section>
                <h3 >Compliance Frameworks</h3>
                <tag data-tpl-if="!audit?.compliance">No data</tag>
                <tag-list data-tpl-if="audit?.compliance">
                    <tag>DORA: {{ audit.compliance.dora }}</tag>
                    <tag>CRA: {{audit.compliance.cra }}</tag>
                    <tag>NIS2: {{audit.compliance.nis2}}</tag>
                    <tag>AI Act: {{audit.compliance.ai_act}}</tag>
                    <tag>GDPR: {{ audit.compliance.gdpr }}</tag>
                    <tag>Data Residency: {{audit.compliance.data_residency}}</tag>
                    <tag>Ads: {{audit.compliance.ads}}</tag>
                </tag-list>
            </section>


            <section data-tpl-if="audit?.environments">
                <h3>Environments</h3>
                <table class="environments">
                    <thead>
                        <tr>
                            <th>Environment</th>
                            <th>Type</th>
                            <th>Platform</th>
                            <th>Ingress</th>
                            <th>Domains</th>
                            <th>Certs</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr data-tpl-each="audit.environments" data-tpl-var="env">
                            <td><strong>{{ env.name }}</strong></td>
                            <td>{{env.type}}</td>
                            <td>{{env.platform}}</td>
                            <td>{{env.ingress}}</td>
                            <td><code>{{env.domains}}</code></td>
                            <td>{{env.certificates}}</td>
                        </tr>
                    </tbody>
                </table>
            </section>


            <section>
                <h3>Outdated Dependencies</h3>
                <tag-list data-tpl-if="dependencies == null">
                    <tag>No data</tag>
                </tag-list>
                <tag-list data-tpl-if="dependencies?.length == 0">
                    <tag>No outdated dependencies found in this project</tag>
                </tag-list>
                <table class="dependencies" data-tpl-if="dependencies?.length > 0">
                    <thead>
                        <tr>
                            <th>Project</th>
                            <th>Artifact</th>
                            <th>Current</th>
                            <th>Latest</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr data-tpl-each="dependencies" data-tpl-var="dep">
                            <td><strong>{{ dep.project }}</strong></td>
                            <td>{{dep.artifact}}</td>
                            <td>
                                <tag class="current">{{dep.current}}</tag>
                            </td>
                            <td>
                                <tag class="latest">{{dep.latest}}</tag>
                            </td>
                        </tr>
                    </tbody>
                </table>

            </section>

            <section>
                <h3>Known vulnerabilities</h3>
                <tag-list data-tpl-if="vulnerabilities == null">
                    <tag>No data</tag>
                </tag-list>
                <tag-list data-tpl-if="vulnerabilities?.length == 0">
                    <tag>No known vulnerabilities found in this project</tag>
                </tag-list>
                <table class="vulnerabilities" data-tpl-if="vulnerabilities?.length > 0">
                    <thead>
                        <tr>
                            <th>Project</th>
                            <th>Artifact</th>
                            <th>Version</th>
                            <th>Vuln ID</th>
                            <th>Trails</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr data-tpl-each="vulnerabilities" data-tpl-var="vuln">
                            <td><strong>{{ vuln.project }}</strong></td>
                            <td>{{vuln.artifact}}</td>
                            <td>{{vuln.version}}</td>
                            <td>
                                <a data-tpl-href="`https://github.com/advisories/{vuln.vuln_id}`" target="_blank" rel="noopener noreferrer">
                                    {{vuln.vuln_id}}
                                </a>
                            </td>
                            <td>
                                <tooltip-trigger>
                                    <tag class="dashed">Depth {{ vuln.trail.length }}</tag>
                                    <tooltip-content>
                                        <div data-tpl-each="vuln.trail">{{ self }}</div>
                                    </tooltip-content>
                                </tooltip-trigger>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>


            <section>
                <h3>Used containers</h3>
                <tag-list>
                    <tag data-tpl-if="!containers">
                        No data
                    </tag>
                    <tag data-tpl-if="containers?.length == 0">
                        No containers referenced in this project
                    </tag>
                    <tag data-tpl-if="containers?.length > 0" data-tpl-each="containers"
                        class="container">
                        {{ self }}
                    </tag>
                </tag-list>
            </section>

            <section>
                <h3>Docker files</h3>
                <tag-list>
                    <tag data-tpl-if="!docker_files.length">No docker files found in this project</tag>
                    <tag data-tpl-each="docker_files" class="dockerfile">{{ self }}</tag>
                </tag-list>
            </section>

            <section>
                <h3>Ansible</h3>
                <tag-list>
                    <tag data-tpl-if="!ansible_confs.length">No ansible configurations found in this project</tag>
                    <tag data-tpl-each="ansible_confs" class="ansible">{{ self }}</tag>
                </tag-list>
            </section>


            <section>
                <h3>Legopfa</h3>
                <tag-list>
                    <tag data-tpl-if="!legopfa_confs.length">No legopfa configurations found in this project</tag>
                    <tag data-tpl-each="legopfa_confs" class="legopfa">{{ self }}</tag>
                </tag-list>
            </section>


        </project-card>

    </template>
    <script type="module">
        import { Templates } from "ftl";
        import { Spinner, InfiniteScroller } from "/repospect.js";

        const spinner = new Spinner();

        const response = await fetch('stats.json');
        if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const data = await response.json();

        spinner.hide();

        const scroller = new InfiniteScroller('projects-grid', 'scroll-sentinel', '#projects-template', spinner);

        const filters = {
            all: () => true,
            live: repo => !repo.archived,
            live_audited: repo => !repo.archived && repo.audit,
            live_unaudited: repo => !repo.archived && !repo.audit,

            public: repo => !repo.private,
            live_public: repo => !repo.archived && !repo.private,
            live_public_audited: repo => !repo.archived && !repo.private && repo.audit,
            live_public_unaudited: repo => !repo.archived && !repo.private && !repo.audit,

            private: repo => repo.private,
            live_private: repo => !repo.archived && repo.private,
            live_private_audited: repo => !repo.archived && repo.private && repo.audit,
            live_private_unaudited: repo => !repo.archived && repo.private && !repo.audit,

            public_vulns: repo => !repo.archived && !repo.private && repo.vulnerabilities?.length,
            public_audited_vulns: repo => !repo.archived && !repo.private && repo.audit && repo.vulnerabilities?.length,
            public_unaudited_vulns: repo => !repo.archived && !repo.private && !repo.audit && repo.vulnerabilities?.length,

            private_vulns: repo => !repo.archived && repo.private && repo.vulnerabilities?.length,
            private_audited_vulns: repo => !repo.archived && repo.private && repo.audit && repo.vulnerabilities?.length,
            private_unaudited_vulns: repo => !repo.archived && repo.private && !repo.audit && repo.vulnerabilities?.length,
        };

        const stats = data.reduce((acc, repo) => {
            const filterEntries = Object.entries(filters);
            for (let i = 0; i != filterEntries.length; i++) {
                const [key, fn] = filterEntries[i];
                if (fn(repo)) acc[key]++;
            }
            return acc;
        }, Object.fromEntries(Object.keys(filters).map(key => [key, 0])));

        Templates.fromSelector('#metrics-template').withOverlay(stats).renderToSelector('metrics-grid');

        await scroller.load(data.values());

        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = new FormData(e.target).get('search').toLowerCase();
            const predicate = item => JSON.stringify(item).toLowerCase().includes(query);

            await scroller.load(data.values().filter(predicate));
        });

        document.querySelector('body').addEventListener('click', async e => {
            const button = e.target.closest('[data-filter]');
            if (!button) {
                return;
            }

            if (button.dataset.filter === 'roulette') {
                const unaudited = data.values().filter(filters.live_unaudited).toArray();
                if (unaudited.length > 0) {
                    const pick = unaudited[Math.floor(Math.random() * unaudited.length)];
                    await scroller.load([pick].values());
                } else {
                    await scroller.load([].values());
                }
                return;
            }

            const filter = filters[button.dataset.filter];
            if (!filter) {
                return;
            }
            await scroller.load(data.values().filter(filter));
        });
    </script>
</body>

</html>

[package]
name = "elaine"
version = "1.8.0"
license = "MIT"
edition = "2024"

[lib]
name = "elaine"
path = "src/lib.rs"

[[bin]]
name = "elaine"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "2.1.0"
schemars = { version = "1.2", features = ["derive"] }
walkdir = "2.5"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
indicatif = "0.18"
tokio = { version = "1.54", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream", "form"] }
futures = "0.3"
axum = "0.8"
tower-http = { version = "0.7", features = ["fs"] }
ring = "0.17"
base64 = "0.23"
rust-embed = "8.13"
mime_guess = "2.0"
tempfile = "3.27"
tar = "0.4"
flate2 = "1.1"
regex = "1.13"
toml = "1.1"
axum-extra = { version = "0.12", features = ["query"] }
lettre = { version = "0.11.24", default-features = false, features = ["builder", "serde", "smtp-transport", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
jiff = "1.0"

[build-dependencies]
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

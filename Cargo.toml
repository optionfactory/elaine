[package]
name = "repospect"
version = "1.0.0"
edition = "2024"

[lib]
name = "repospect"
path = "src/lib.rs"

[[bin]]
name = "repospect"
path = "src/main.rs"

[dependencies]
pinch = { path = "../pinch", default-features = false}
#pinch = { git = "https://github.com/optionfactory/pinch.git", default-features = false}

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "1.0.0"

chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"

clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
indicatif = "0.18"

tokio = { version = "1.53", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
futures = "0.3"

tempfile = "3.27"
tar = "0.4"
flate2 = "1.1"
regex = "1.13"
